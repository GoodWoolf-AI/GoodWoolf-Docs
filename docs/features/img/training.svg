      <path d="M-8-6V6c0 1.8 3.6 3.2 8 3.2S8 7.8 8 6V-6"/>
      <path d="M-8 0c0 1.8 3.6 3.2 8 3.2S8 1.8 8 0"/>
    </g>
    <g transform="translate(584 118)">
