<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" aria-labelledby="t d" style="--bg:#f8fafc;--panel:#ffffff;--ink:#0f172a;--muted:#475569;--g-fill:#ecfccb;--g-stroke:#a3e635;--g-acc:#4d7c0f;--b-fill:#dbeafe;--b-stroke:#93c5fd;--b-acc:#1d4ed8;--o-fill:#ffedd5;--o-stroke:#fdba74;--o-acc:#c2410c;--shadow:0.10">
  <desc id="d">Participants A, B and C exchange training updates and model weights with a Training Ledger. A peer or independent auditor validates and aggregates accepted updates against the ledger.</desc>
  <style>text{font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif}.title{font-size:20px;font-weight:650;fill:var(--ink)}.sub{font-size:13px;fill:var(--muted)}.li{font-size:14px;fill:var(--ink)}.chip-t{font-size:13px;font-weight:550;text-anchor:middle}.b,.g,.o{fill:var(--g-fill);stroke:var(--g-stroke);stroke-width:1.5}.b,.o{fill:var(--b-fill);stroke:var(--b-stroke)}.o{fill:var(--o-fill);stroke:var(--o-stroke)}.g-acc{fill:var(--g-acc)}.b-acc{fill:var(--b-acc)}.o-acc{fill:var(--o-acc)}.g-ink{stroke:var(--g-acc)}.b-ink{stroke:var(--b-acc)}.o-ink{stroke:var(--o-acc)}.badge,.chip{fill:var(--panel)}.chip{stroke:var(--b-stroke);stroke-width:1.2}.chip-t{fill:var(--b-acc)}.glyph{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}</style>
  <defs>
    <marker id="head-g" markerHeight="5" markerWidth="5" orient="auto" refX="8" refY="5" viewBox="0 0 10 10">
