    </marker>
    <marker id="head-b" markerHeight="5" markerWidth="5" orient="auto" refX="8" refY="5" viewBox="0 0 10 10">
      <path d="m0 0 10 5-10 5z" style="fill:var(--b-acc)"/>
    </marker>
    <marker id="head-o" markerHeight="5" markerWidth="5" orient="auto" refX="8" refY="5" viewBox="0 0 10 10">
      <path d="m0 0 10 5-10 5z" style="fill:var(--o-acc)"/>
    </marker>
    <filter id="shadow" width="120%" height="140%" x="-10%" y="-15%">
      <feDropShadow dx="0" dy="6" flood-color="#0f172a" stdDeviation="8" style="flood-opacity:var(--shadow)"/>
    </filter>
  </defs>
  <g style="fill:none;stroke-width:2.5;stroke-linecap:round">
    <path marker-end="url(#head-g)" d="M141 172v202" class="g-ink"/>
